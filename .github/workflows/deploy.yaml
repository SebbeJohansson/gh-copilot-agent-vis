name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-progress run for the same branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack (Yarn Berry)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate static site
        run: yarn generate
        env:
          # Set the base URL to the repository subpath so all asset references
          # and router links are correct when served from GitHub Pages.
          NUXT_APP_BASE_URL: /gh-copilot-agent-vis/
          NODE_ENV: production

      - name: Copy index.html to 404.html for SPA fallback routing
        run: cp .output/public/index.html .output/public/404.html

      - name: Add .nojekyll to prevent Jekyll processing
        run: touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
